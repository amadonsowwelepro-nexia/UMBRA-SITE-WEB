<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- Fond Noir -->
  <rect width="500" height="500" fill="#000000"/>

  <!-- Coins de viseur (Équerres ouvertes) -->
  <path d="M 200 80 L 80 80 L 80 200" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="square"/>
  <path d="M 300 80 L 420 80 L 420 200" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="square"/>
  <path d="M 420 300 L 420 420 L 300 420" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="square"/>
  <path d="M 80 300 L 80 420 L 200 420" fill="none" stroke="#FFFFFF" stroke-width="22" stroke-linecap="square"/>

  <!-- Voyant REC (Point Violet) -->
  <circle cx="130" cy="130" r="16" fill="#7C3AED"/>

  <!-- Typographie AMA / DON -->
  <text x="250" y="235" font-family="'Impact', 'Arial Black', sans-serif" font-size="110" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">AMA</text>
  <text x="250" y="335" font-family="'Impact', 'Arial Black', sans-serif" font-size="110" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">DON</text>
</svg>
